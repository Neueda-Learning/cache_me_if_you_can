version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hawk_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: transaction_monitoring
    ports:
      - "3306:3306"
    volumes:
      - hawk_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/neueda-learning/cache_me_if_you_can:latest
    container_name: hawk_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/transaction_monitoring?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      HAWK_JWT_SECRET: ${HAWK_JWT_SECRET}
      HAWK_JWT_EXPIRY_HOURS: 24
      HAWK_ADMIN_USERNAME: ${HAWK_ADMIN_USERNAME}
      HAWK_ADMIN_PASSWORD: ${HAWK_ADMIN_PASSWORD}
      HAWK_ADMIN_FULLNAME: System Administrator
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      HAWK_MAIL_OUTPUT_DIR: /app/account-mails
    volumes:
      - ./account-mails:/app/account-mails

volumes:
  hawk_mysql_data:

