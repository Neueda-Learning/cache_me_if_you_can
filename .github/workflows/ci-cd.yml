name: CI/CD Pipeline - HAWK Transaction Monitor
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
env:
  REGISTRY: ghcr.io
jobs:
  test:
    name: 1) Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: citestpassword
          MYSQL_DATABASE: transaction_monitoring
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Write application.properties for CI
        run: |
          cat > src/main/resources/application.properties <<EOF
          spring.application.name=transaction_monitor
          spring.datasource.url=jdbc:mysql://localhost:3306/transaction_monitoring?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          spring.datasource.username=root
          spring.datasource.password=citestpassword
          spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
          spring.sql.init.mode=always
          spring.sql.init.schema-locations=classpath:schema.sql
          hawk.jwt.secret=CITestJwtSecretKeyForHawkMonitoringPlatform2026
          hawk.jwt.expiry-hours=24
          hawk.admin.username=admin
          hawk.admin.password=Admin@1234
          hawk.admin.fullname=System Administrator
          spring.mail.host=smtp.gmail.com
          spring.mail.port=587
          spring.mail.username=test@example.com
          spring.mail.password=testpassword
          spring.mail.properties.mail.smtp.auth=true
          spring.mail.properties.mail.smtp.starttls.enable=true
          spring.mail.default-encoding=UTF-8
          spring.mail.properties.mail.debug=false
          logging.level.org.springframework.mail=INFO
          EOF
      - name: Run tests
        run: mvn -B clean test
  package:
    name: 2) Package JAR
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Write application.properties for CI
        run: |
          cat > src/main/resources/application.properties <<EOF
          spring.application.name=transaction_monitor
          spring.datasource.url=jdbc:mysql://localhost:3306/transaction_monitoring?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          spring.datasource.username=root
          spring.datasource.password=citestpassword
          spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
          spring.sql.init.mode=always
          spring.sql.init.schema-locations=classpath:schema.sql
          hawk.jwt.secret=CITestJwtSecretKeyForHawkMonitoringPlatform2026
          hawk.jwt.expiry-hours=24
          hawk.admin.username=admin
          hawk.admin.password=Admin@1234
          hawk.admin.fullname=System Administrator
          spring.mail.host=smtp.gmail.com
          spring.mail.port=587
          spring.mail.username=test@example.com
          spring.mail.password=testpassword
          spring.mail.properties.mail.smtp.auth=true
          spring.mail.properties.mail.smtp.starttls.enable=true
          spring.mail.default-encoding=UTF-8
          spring.mail.properties.mail.debug=false
          logging.level.org.springframework.mail=INFO
          EOF
      - name: Build JAR
        run: mvn -B clean package -DskipTests
  docker-verify:
    name: 3) Docker Build Check (PR)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
  publish:
    name: 4) Publish to GHCR (master push)
    runs-on: ubuntu-latest
    needs: [test, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Compute lowercase image name
        id: vars
        run: |
          echo "repo_lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.repo_lc }}:latest
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.repo_lc }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish summary
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ steps.vars.outputs.repo_lc }}"
          echo "Tags: latest, sha-${{ github.sha }}"
