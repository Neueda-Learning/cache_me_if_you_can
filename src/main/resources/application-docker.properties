# Docker runtime profile ? all values injected via environment variables
spring.application.name=transaction_monitor
server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

hawk.jwt.secret=${HAWK_JWT_SECRET}
hawk.jwt.expiry-hours=${HAWK_JWT_EXPIRY_HOURS:24}

hawk.admin.username=${HAWK_ADMIN_USERNAME:admin}
hawk.admin.password=${HAWK_ADMIN_PASSWORD:Admin@1234}
hawk.admin.fullname=${HAWK_ADMIN_FULLNAME:System Administrator}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.debug=false
logging.level.org.springframework.mail=INFO
hawk.mail.output-dir=${HAWK_MAIL_OUTPUT_DIR:/app/account-mails}
