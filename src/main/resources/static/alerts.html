<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAWK | Alert Management</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script defer src="/js/common.js"></script>
  <script defer src="/js/alerts.js"></script>
</head>
<body>

  <div id="hawkLoader">
    <img src="/images/HAWK.png" alt="Loading...">
    <p class="loader-text">Loading · HAWK</p>
  </div>

  <header class="topbar">
    <a class="brand" href="/dashboard.html">
      <img src="/images/HAWK.png" alt="HAWK" class="hawk-logo">
    </a>
    <div class="topbar-user">
      <span id="operatorName">Operator</span>
      <a href="/login.html" style="color:var(--hawk-red);font-weight:500;">Logout</a>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="nav-section-label">Navigation</div>
      <a class="nav-link" href="/dashboard.html"><span class="nav-icon">🏠</span> Dashboard</a>
      <a class="nav-link" href="/transactions.html"><span class="nav-icon">💳</span> Transactions</a>
      <a class="nav-link" href="/accounts.html"><span class="nav-icon">🏦</span> Accounts</a>
      <a class="nav-link" href="/payees.html"><span class="nav-icon">👤</span> Payees</a>
      <a class="nav-link active" href="/alerts.html"><span class="nav-icon">🚨</span> Alerts</a>
      <a class="nav-link" href="/rules.html"><span class="nav-icon">⚙️</span> Rules</a>
    </aside>

    <main class="main">
      <h1 class="page-title">Alert Management</h1>
      <p class="page-subtitle">Review, filter, and action all system alerts. Click an alert to manage its lifecycle.</p>

      <form id="alertFilters" class="filters card">
        <select id="statusFilter">
          <option value="">All Statuses</option>
          <option>OPEN</option>
          <option>ACKNOWLEDGED</option>
          <option>INVESTIGATING</option>
          <option>CLOSED</option>
          <option>DISMISSED</option>
        </select>
        <select id="severityFilter">
          <option value="">All Severities</option>
          <option>CRITICAL</option>
          <option>HIGH</option>
          <option>MEDIUM</option>
          <option>LOW</option>
        </select>
        <select id="timeRangeFilter" aria-label="Time range">
          <option value="ALL">All time</option>
          <option value="60">Last 60 minutes</option>
          <option value="1440">Last 24 hours</option>
          <option value="10080">Last 7 days</option>
        </select>
        <!-- Apply Filters button removed: filters auto-apply on change -->
      </form>


      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Alert ID</th>
              <th>Rule</th>
              <th>TRANSACTION ID</th>
              <th>Severity</th>
              <th>Status</th>
              <th>Created</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="alertsBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="toast"></div>
</body>
</html>
