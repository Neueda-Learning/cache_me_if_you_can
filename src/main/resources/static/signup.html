<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAWK | Create Account</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script defer src="/js/common.js"></script>
  <script defer src="/js/auth-pages.js"></script>
</head>
<body class="auth-page">
  <section class="auth-card">
    <div class="auth-top-bar"></div>
    <a href="/">
      <img src="/images/HAWK.png" alt="HAWK" class="auth-logo">
    </a>
    <h1>Create Account</h1>
    <p class="auth-desc">Register to get access to the HAWK monitoring platform.</p>

    <form id="signupForm" class="auth-form">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input id="firstName" type="text" required placeholder="e.g. John">
        </div>
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input id="lastName" type="text" required placeholder="e.g. Smith">
        </div>
      </div>
      <div class="form-group">
        <label for="workEmail">Work Email</label>
        <input id="workEmail" type="email" required placeholder="e.g. john.smith@company.com">
      </div>
      <div class="form-group">
        <label for="newUsername">Username</label>
        <input id="newUsername" type="text" required placeholder="e.g. john.smith">
      </div>
      <div class="form-group">
        <label for="newPassword">Password</label>
        <input id="newPassword" type="password" required placeholder="Minimum 8 characters">
      </div>
      <button class="btn-primary" type="submit" style="margin-top:4px;">Create Account</button>
    </form>

    <div class="auth-footer">
      <div>Already have an account? <a href="/login.html">Sign In</a></div>
      <div><a href="/">← Back to Home</a></div>
    </div>
  </section>
  <div id="toast"></div>
</body>
</html>
