<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAWK | Administrator Login</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script defer src="/js/common.js"></script>
  <script defer src="/js/auth-pages.js"></script>
</head>
<body class="auth-page">
  <section class="auth-card">
    <div class="auth-top-bar"></div>
    <a href="/">
      <img src="/images/HAWK.png" alt="HAWK" class="auth-logo">
    </a>
    <h1>Administrator Login</h1>
    <p class="auth-desc">Sign in as administrator to access the HAWK monitoring platform.</p>

    <form id="loginForm" class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" type="text" required placeholder="e.g. admin">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password">
      </div>
      <p id="loginError" style="color:#DB0011;font-size:0.82rem;margin:0 0 8px;display:none;"></p>
      <button class="btn-primary" type="submit" style="margin-top:4px;">Sign In</button>
    </form>

    <div class="auth-footer">
      <div><a href="/">← Back to Home</a></div>
    </div>
  </section>
  <div id="toast"></div>
</body>
</html>
