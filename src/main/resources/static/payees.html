<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAWK | Payees</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script defer src="/js/common.js"></script>
  <script defer src="/js/payees.js"></script>
</head>
<body>

  <div id="hawkLoader">
    <img src="/images/HAWK.png" alt="Loading...">
    <p class="loader-text">Loading · HAWK</p>
  </div>

  <header class="topbar">
    <a class="brand" href="/dashboard.html">
      <img src="/images/HAWK.png" alt="HAWK" class="hawk-logo">
    </a>
    <div class="topbar-user">
      <span id="operatorName">Operator</span>
      <a href="/login.html" style="color:var(--hawk-red);font-weight:500;">Logout</a>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="nav-section-label">Navigation</div>
      <a class="nav-link" href="/dashboard.html"><span class="nav-icon">🏠</span> Dashboard</a>
      <a class="nav-link" href="/transactions.html"><span class="nav-icon">💳</span> Transactions</a>
      <a class="nav-link" href="/accounts.html"><span class="nav-icon">🏦</span> Accounts</a>
      <a class="nav-link active" href="/payees.html"><span class="nav-icon">👤</span> Payees</a>
      <a class="nav-link" href="/alerts.html"><span class="nav-icon">🚨</span> Alerts</a>
      <a class="nav-link" href="/rules.html"><span class="nav-icon">⚙️</span> Rules</a>
    </aside>

    <main class="main">
      <h1 class="page-title">Payee Registry</h1>
      <p class="page-subtitle">Register recipient payees. Each transaction references a Payee ID from this list.</p>

      <!-- Add Payee Form -->
      <section class="card" style="margin-bottom:16px;">
        <h2 style="margin:0 0 16px;font-size:1rem;font-weight:700;">Register New Payee</h2>
        <form id="payeeForm" class="filters">
          <input id="payeeName" required placeholder="Payee Name (e.g. Bob's Electronics)">
          <input id="payeeAccNum" required placeholder="Payee Account Number (12 digits)">
          <input id="payeeBank" required placeholder="Bank Name (e.g. HSBC)">
          <button class="btn-primary" type="submit">+ Add Payee</button>
        </form>
      </section>

      <!-- Payees Table -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Payee ID</th>
              <th>Payee Name</th>
              <th>Account Number</th>
              <th>Bank</th>
            </tr>
          </thead>
          <tbody id="payeesBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="toast"></div>
</body>
</html>
